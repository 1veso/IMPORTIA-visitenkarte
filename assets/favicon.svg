<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="rgba(216,178,112,0)"/>
      <stop offset="94%" stop-color="rgba(216,178,112,0.32)"/>
      <stop offset="100%" stop-color="rgba(216,178,112,0)"/>
    </radialGradient>
  </defs>

  <!-- rounded navy field -->
  <rect width="64" height="64" rx="9" fill="#0A1730"/>

  <!-- subtle warm gold atmospheric corona -->
  <circle cx="32" cy="32" r="28" fill="url(#atmo)"/>

  <!-- world globe in blue (rim, equator, polar axis, two meridians) -->
  <g stroke="#6F92B8" stroke-width="1.4" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="22"/>
    <ellipse cx="32" cy="32" rx="22" ry="8"/>
    <ellipse cx="32" cy="32" rx="8"  ry="22"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
  </g>

  <!-- abstract continents (deeper blue) -->
  <g fill="#3D6391" opacity="0.75">
    <path d="M 18 26 Q 24 24 28 27 L 28 32 Q 24 32 19 30 Z"/>
    <path d="M 36 30 Q 42 30 45 33 Q 43 38 38 36 Z"/>
    <path d="M 24 36 Q 28 36 30 39 L 28 42 Q 24 41 23 38 Z"/>
  </g>

  <!-- Roman "I" in gold, centred and bold -->
  <g fill="#D8B270">
    <rect x="20" y="12" width="24" height="4" rx="0.4"/>
    <rect x="29" y="12" width="6"  height="40"/>
    <rect x="20" y="48" width="24" height="4" rx="0.4"/>
  </g>
</svg>
